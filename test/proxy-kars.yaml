# Proxy Deployment configured for the karssandbox backend. Used by harness.sh
# test kars; mirrors proxy-substrate.yaml but wires BACKEND=karssandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-proxy
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: playwright-proxy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playwright-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playwright-proxy
    spec:
      serviceAccountName: playwright-proxy
      containers:
        - name: proxy
          image: PROXY_IMAGE
          imagePullPolicy: Never
          ports:
            - { name: data, containerPort: 9000 }
            - { name: mgmt, containerPort: 9090 }
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - { name: BACKEND,            value: "karssandbox" }
            - { name: KARS_INFERENCE_REF, value: "playwright" }
            - { name: KARS_SANDBOX_IMAGE, value: "PLAYWRIGHT_IMAGE" }
            - { name: SANDBOX_PORT,       value: "9222" }
            - { name: IDLE_TTL,           value: "10m" }
            - { name: IDLE_CHECK_INTERVAL, value: "30s" }
            # KarsSandbox cold start: namespace create + pod schedule +
            # Chromium startup is slower than agent-sandbox (no warmpool).
            # Give the Ensure loop enough headroom.
            - { name: ENSURE_TIMEOUT,     value: "180s" }
          readinessProbe:
            httpGet: { path: /readyz, port: mgmt }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: mgmt }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-proxy
  namespace: NAMESPACE
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: playwright-proxy
  ports:
    - { name: data, port: 9000, targetPort: data }
