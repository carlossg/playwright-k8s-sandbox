# Labelled Job that drives Playwright through the proxy over MCP-over-HTTP
# (the streamable-HTTP counterpart to playwright-client-job.yaml, which uses
# the native WebSocket protocol). The Job's Pod carries the playwright-id label
# so the proxy resolves it on the source IP path and — because the request is
# plain HTTP, not a WS upgrade — routes it to the sandbox's MCP port.
#
# Uses the same slim image as the sandbox: it bundles @modelcontextprotocol/sdk
# for the MCP client (mcp-client.js from the /scripts ConfigMap).
apiVersion: batch/v1
kind: Job
metadata:
  name: playwright-mcp-e2e-CLIENTID
  namespace: NAMESPACE
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playwright-mcp-e2e-client
        playwright-id: CLIENTID
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: localhost:5001/playwright-substrate:slim-1.53.0
          imagePullPolicy: Never
          command: ["node", "/scripts/mcp-client.js"]
          env:
            # Dockerfile ENV isn't propagated by every runtime; set explicitly
            # so node finds the globally-installed npm modules (playwright +
            # @modelcontextprotocol/sdk).
            - name: NODE_PATH
              value: /usr/local/lib/node_modules
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /ms-playwright
            - name: PW_MCP_URL
              value: "http://playwright-proxy:9000/mcp"
            - name: PW_ID
              value: "CLIENTID"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
      volumes:
        - name: scripts
          configMap:
            name: playwright-scripts
