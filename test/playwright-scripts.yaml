# client.js runs in the test Job. The sandbox-side server.js is baked into
# the slim image (proxy/test/playwright-substrate.Dockerfile) so this
# ConfigMap only carries the client-side script.
apiVersion: v1
kind: ConfigMap
metadata:
  name: playwright-scripts
  namespace: NAMESPACE
data:
  client.js: |
    // Drives a real page fetch through the proxy:
    //   - WS connect to ws://playwright-proxy:9000/ goes through our proxy to the sandbox.
    //   - chromium.connect speaks Playwright protocol over that WS.
    //   - page.goto issues a real HTTP GET from inside the sandbox to TARGET_URL.
    //     We point it at an in-cluster traefik/whoami so the response includes the
    //     target Pod's hostname, which we assert client-side. This proves the
    //     proxy didn't just upgrade WS — the headless browser actually fetched
    //     a page and parsed the response.
    // Bench-friendly client: emits a single line "BENCH <json>" with timing
    // breakdown so the harness can grep + parse from `kubectl logs`.
    const { chromium } = require('playwright');
    const URL    = process.env.PW_URL;
    const ID     = process.env.PW_ID || 'unknown';
    const TARGET = process.env.PW_TARGET_URL || 'http://test-target/';
    // Retry chromium.connect on two transient conditions:
    //   1. 403 — a small window where the proxy's pod informer hasn't yet seen
    //      this pod's IP via WATCH, even though the Job is already running us.
    //   2. connection errors (ETIMEDOUT/ECONNREFUSED/reset/1006) — when the
    //      proxy Deployment was just rolled/restarted, the Service endpoint can
    //      briefly still target the old (terminating) pod, so the SYN is dropped
    //      until kube-proxy resettles. A real client tolerates a bouncing proxy;
    //      the test must too or it flakes on every proxy redeploy.
    // Bound the retry so we don't mask real misconfiguration.
    // chromium.connect's default timeout is 30s; cold-start substrate restores
    // from a snapshot which can take >30s, during which the proxy holds the
    // WS upgrade. Give the connect itself a 3-minute timeout so the client
    // doesn't drop while the proxy is legitimately waiting on the actor.
    const CONNECT_TIMEOUT_MS = Number(process.env.PW_CONNECT_TIMEOUT_MS || '180000');
    const RETRYABLE = /403|Forbidden|not labelled|ETIMEDOUT|ECONNREFUSED|ECONNRESET|EHOSTUNREACH|ENETUNREACH|EPIPE|socket hang up|1006|WebSocket error/i;
    async function connectWithRetry(url, deadlineMs = 60000) {
      const deadline = Date.now() + deadlineMs;
      for (;;) {
        try { return await chromium.connect(url, { timeout: CONNECT_TIMEOUT_MS }); }
        catch (e) {
          const msg = String(e && e.message || e);
          if (Date.now() < deadline && RETRYABLE.test(msg)) {
            await new Promise(r => setTimeout(r, 500));
            continue;
          }
          throw e;
        }
      }
    }
    (async () => {
      const t0 = Date.now();
      const browser = await connectWithRetry(URL);
      const t1 = Date.now();
      const ctx = await browser.newContext();
      const page = await ctx.newPage();
      const t2 = Date.now();
      const resp = await page.goto(TARGET, { waitUntil: 'load', timeout: 30000 });
      const t3 = Date.now();
      if (!resp || !resp.ok()) {
        console.error('FAIL [' + ID + '] page.goto status=' + (resp && resp.status()));
        process.exit(1);
      }
      const body = await page.content();
      const m = body.match(/Hostname:\s*([^<\s]+)/);
      if (!m) {
        console.error('FAIL [' + ID + '] no Hostname in body:', body.slice(0, 200));
        process.exit(1);
      }
      const timing = {
        id: ID,
        connect_ms: t1 - t0,
        newPage_ms: t2 - t1,
        goto_ms:    t3 - t2,
        total_ms:   t3 - t0,
        hostname:   m[1],
      };
      console.log('BENCH ' + JSON.stringify(timing));
      await browser.close();
    })().catch((e) => { console.error('error:', e && e.stack || e); process.exit(2); });
  mcp-client.js: |
    // MCP-over-HTTP counterpart to client.js. Drives a real page fetch through
    // the proxy over the Model Context Protocol (streamable HTTP transport):
    //   - HTTP POST/GET to http://playwright-proxy:9000/mcp goes through our
    //     proxy. Because it is NOT a WebSocket upgrade, the proxy routes it to
    //     the sandbox's MCP-over-HTTP port (SANDBOX_MCP_PORT), distinct from the
    //     WS port used by client.js. This exercises the two-port routing.
    //   - @playwright/mcp inside the sandbox drives a real Chromium and issues
    //     an HTTP GET to TARGET (in-cluster traefik/whoami) via browser_navigate.
    //   - We assert the navigate tool call succeeded and best-effort parse the
    //     upstream Hostname from the returned page snapshot.
    // Emits "BENCH <json>" like client.js so the harness can grep + parse.
    const { Client } = require('@modelcontextprotocol/sdk/client/index.js');
    const { StreamableHTTPClientTransport } = require('@modelcontextprotocol/sdk/client/streamableHttp.js');
    const MCP_URL = process.env.PW_MCP_URL || 'http://playwright-proxy:9000/mcp';
    const ID      = process.env.PW_ID || 'unknown';
    const TARGET  = process.env.PW_TARGET_URL || 'http://test-target/';
    // Same transient conditions as the WS client: (1) the cold-informer 403
    // race where the proxy hasn't yet seen this pod's IP via WATCH, and (2)
    // connection errors while the proxy Deployment is mid-rollout and the
    // Service endpoint still points at the old (terminating) pod. Retry on both.
    const RETRYABLE = /403|Forbidden|not labelled|ETIMEDOUT|ECONNREFUSED|ECONNRESET|EHOSTUNREACH|ENETUNREACH|EPIPE|socket hang up|fetch failed/i;
    async function connectWithRetry(deadlineMs = 60000) {
      const deadline = Date.now() + deadlineMs;
      for (;;) {
        const transport = new StreamableHTTPClientTransport(new URL(MCP_URL));
        const client = new Client({ name: 'pw-e2e-mcp', version: '1.0.0' }, { capabilities: {} });
        try { await client.connect(transport); return client; }
        catch (e) {
          const msg = String(e && e.message || e);
          try { await transport.close(); } catch (_) {}
          if (Date.now() < deadline && RETRYABLE.test(msg)) {
            await new Promise(r => setTimeout(r, 500));
            continue;
          }
          throw e;
        }
      }
    }
    function textOf(result) {
      const parts = (result && result.content) || [];
      return parts.filter(p => p && p.type === 'text').map(p => p.text).join('\n');
    }
    // @playwright/mcp@0.0.29 (the version pinned to playwright 1.53.0) emits
    // tool definitions whose inputSchema omits the mandatory `type: "object"`,
    // so @modelcontextprotocol/sdk's strict `client.listTools()` rejects the
    // whole response with a ZodError. That is an upstream schema quirk of the
    // server, orthogonal to what this test proves (the proxy's two-port
    // MCP-over-HTTP routing). Fetch tools/list with a passthrough result schema
    // so we can still assert browser_navigate is advertised; callTool below
    // stays on the strict high-level API, so the actual tool call + its result
    // are still validated end-to-end through the proxy.
    const passthroughSchema = { parse: (x) => x, safeParse: (x) => ({ success: true, data: x }) };
    (async () => {
      const t0 = Date.now();
      const client = await connectWithRetry();
      const t1 = Date.now();
      const listed = await client.request({ method: 'tools/list' }, passthroughSchema);
      const names = ((listed && listed.tools) || []).map(t => t.name);
      if (!names.includes('browser_navigate')) {
        console.error('FAIL [' + ID + '] browser_navigate tool missing; tools=' + names.join(','));
        process.exit(1);
      }
      const t2 = Date.now();
      const nav = await client.callTool({ name: 'browser_navigate', arguments: { url: TARGET } });
      const t3 = Date.now();
      if (nav && nav.isError) {
        console.error('FAIL [' + ID + '] browser_navigate error: ' + textOf(nav).slice(0, 300));
        process.exit(1);
      }
      const out = textOf(nav);
      if (!out) {
        console.error('FAIL [' + ID + '] empty navigate result');
        process.exit(1);
      }
      // Best-effort: the whoami page renders as plain text, so its snapshot
      // usually carries "Hostname: <pod>". Assert it when present.
      const m = out.match(/Hostname:\s*([^\s<"]+)/);
      const timing = {
        id: ID,
        protocol: 'mcp',
        connect_ms: t1 - t0,
        tools_ms:   t2 - t1,
        navigate_ms: t3 - t2,
        total_ms:   t3 - t0,
        tool_count: names.length,
        hostname:   m ? m[1] : 'n/a',
      };
      console.log('BENCH ' + JSON.stringify(timing));
      await client.close();
    })().catch((e) => { console.error('error:', e && e.stack || e); process.exit(2); });
