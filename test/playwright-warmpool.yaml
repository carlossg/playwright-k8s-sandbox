apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: NAME
  namespace: NAMESPACE
spec:
  # 3 pre-warmed sandboxes: the e2e runs two WS clients (alpha, beta) plus one
  # MCP client (gamma), each of which claims a distinct sandbox.
  replicas: 3
  sandboxTemplateRef:
    name: NAME
  updateStrategy:
    type: OnReplenish
