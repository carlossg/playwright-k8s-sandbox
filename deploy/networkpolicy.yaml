# NetworkPolicy restricts proxy ingress/egress traffic.
# Adjust selectors based on your actual sandbox pod labels and cluster setup.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: playwright-proxy
  namespace: NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: playwright-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from sandbox pods in the same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9000
    # Allow health checks from kubelet/monitoring
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow connection to Kubernetes API server
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow connection to sandbox pods in same namespace
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9222
